name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: OpenCode adapter
        run: node --test integrations/opencode.test.mjs

      # The corpus numbers are the product's actual claim, so print them on every
      # run rather than leaving them to a README assertion nobody re-measures.
      - name: Detection report
        run: cargo test --test corpus_report -- --nocapture
