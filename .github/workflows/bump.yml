# Every pull request carries its own patch bump, so `main` arrives already
# versioned. No commit is ever pushed to `main` and no pull request is ever
# opened by CI — which is the point, because this workflow is not allowed to do
# either and both refusals are correct.
#
# It pushed straight to `main` first: `main`'s ruleset requires a pull request
# and the bot is not a bypass actor, so every merge died on GH013. Opening a
# pull request instead failed on a second, separate policy — "GitHub Actions is
# not permitted to create or approve pull requests" — which is off by default
# and exists precisely so a workflow cannot manufacture its own review.
#
# Rather than ask for an exemption from either, the bump moved to where no
# permission is needed: the PR branch, which is not protected and which the bot
# may push to with the `contents: write` it already has. The version lands in
# the same squash commit as the change that earned it.
#
# Loop safety is a state check, not a message prefix: the job compares the
# branch's version against `main`'s and exits when they already differ. Its own
# push re-triggers `synchronize` exactly once, which then no-ops.
name: Bump patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bump:
    # Fork branches cannot be pushed to, and a release PR carries a deliberate
    # minor/major bump that must not be incremented underneath it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.title, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Bump patch version
        run: |
          set -euo pipefail
          version_of() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }

          git fetch --depth=1 origin main
          base=$(git show origin/main:Cargo.toml | version_of)
          current=$(version_of < Cargo.toml)

          if [ "$current" != "$base" ]; then
            echo "already bumped for this PR ($base -> $current)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          new="${base%.*}.$(( ${base##*.} + 1 ))"
          sed -i "0,/^version = \"$base\"$/s//version = \"$new\"/" Cargo.toml
          cargo update --workspace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -s because the DCO check does not care that the author is a bot.
          git commit -a -s -m "release: v$new"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "bumped $base -> $new" >> "$GITHUB_STEP_SUMMARY"
