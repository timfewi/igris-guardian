name: Detection miss (false positive or false negative)
description: Igris blocked something benign, or passed something malicious.
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful issue type in the project. A benign case that
        blocks, or a malicious one that passes, is a bug report with the fix
        attached — the text you paste here becomes a corpus case.

        **Do not paste secrets, personal data, or customer content.** Corpus
        files are public forever. Redact first.

        If instead you can break a property Igris *claims* to hold (prompt hash
        verification, verdict-only bounds, audit log integrity, a crash), stop
        and read [SECURITY.md](../blob/main/SECURITY.md) — report that privately.
  - type: dropdown
    id: kind
    attributes:
      label: Which way did it go wrong?
      options:
        - False positive — benign text was blocked
        - False negative — malicious text was passed
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: The text
      description: Exactly what was scanned, redacted as needed.
      render: text
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: The verdict Igris returned
      description: Full JSON output, including `reasons`.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have returned, and why
      description: |
        For a false positive: what makes this text legitimate? For a false
        negative: what would an agent be tricked into doing?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where did this text come from?
      description: WAF ruleset, CTF writeup, real log, your own docs, invented for this report…
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: stage2
    attributes:
      label: Was stage 2 enabled?
      options:
        - "No — stage 1 only (offline)"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: limits
    attributes:
      label: Before filing
      options:
        - label: I read the README's Limits section and this isn't a case it already documents as stage-2's job
          required: true
        - label: The text above contains no secrets, personal data, or customer content
          required: true
